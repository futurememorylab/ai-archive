name: CI

# The PR gate. deploy.yml only runs on pushes to main and v* tags, so without
# this workflow a PR merges untested. Mirrors the local pre-commit hooks so
# the gates hold even when a contributor (or an agent session) never ran
# `pre-commit install`. basedpyright runs against the baseline in
# .basedpyright/baseline.json; the version is pinned in pyproject so the
# baseline keeps matching.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # On a PR the ratchets compare against the merge-base with the target
      # branch; on a push to main there is nothing to compare with.
      BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the ratchets need the merge-base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: Import contracts
        run: lint-imports
      - name: Structural erosion gate
        run: python tools/erosion_gate.py --path backend --baseline .erosion-baseline.json --max-cc 30 ${BASE_REF:+--base-ref "$BASE_REF"}
      - name: Type check (basedpyright, baselined)
        run: basedpyright backend tests
      - name: Type baseline may only shrink
        if: env.BASE_REF != ''
        run: python tools/type_baseline_gate.py --base-ref "$BASE_REF"
      - name: Docstring coverage (interrogate)
        run: interrogate -c pyproject.toml
      - name: Duplicate code (pylint)
        run: pylint backend --disable=all --enable=duplicate-code --min-similarity-lines=14

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -n auto -q
