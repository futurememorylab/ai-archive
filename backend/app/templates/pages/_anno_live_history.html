{# Chats about this clip, newest first — read-only. #}
<div class="live-history">
  {% if sessions %}
    <ul class="live-history-list">
      {% for s in sessions %}
        <li class="live-history-item"
            x-data="{ open: false, detail: null, loading: false }">
          <button type="button" class="live-history-row"
                  @click="open = !open;
                          if (open && !detail) {
                            loading = true;
                            const r = await fetch('/api/live/sessions/{{ s.id }}');
                            if (r.ok) detail = await r.json();
                            loading = false;
                          }">
            {%- set when = s.started_at or s.created_at %}
            <span class="ts" title="{{ when }}" x-text="fmtWhen('{{ when }}')">{{ when }}</span>
            <span class="dur mono" title="Length">{% if s.duration_s %}<span x-text="fmtTimecode({{ s.duration_s|int }})"></span>{% else %}—{% endif %}</span>
            <span class="has-summary" title="Summary">{% if s.has_summary %}✓{% else %}—{% endif %}</span>
          </button>
          <div class="live-history-detail" x-show="open" x-cloak>
            <template x-if="loading"><div>Loading…</div></template>
            <template x-if="detail">
              <div>
                <div class="live-summary" x-show="detail.summary_cs">
                  <b>Summary:</b> <span x-text="detail.summary_cs"></span>
                </div>
                <div class="live-summary-missing" x-show="!detail.summary_cs">
                  <button type="button"
                          @click="
                            const r = await fetch('/api/live/sessions/{{ s.id }}/summarize', {method:'POST'});
                            if (r.ok) { const d = await r.json(); detail.summary_cs = d.summary_cs; }">
                    Write a summary
                  </button>
                </div>
                <div class="live-transcript live-chat">
                  <template x-for="(line, i) in detail.transcript" :key="i">
                    <div class="chat-msg" :class="'chat-' + line.role">
                      <span class="chat-bubble" x-text="line.text"></span>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="empty">No chats about this clip yet.</p>
  {% endif %}
</div>
